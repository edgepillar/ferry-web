name: Validate master dependency patches
run-name: Master dependency source 76b440c validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master-dependency-76b440c-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the reviewed PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edgepillar/ferry-web
          ref: 76b440cafc66621e3cb29072a1f4a3ba57f3e0d1
          persist-credentials: false

      - name: Verify source and lockfile pins
        run: |
          test "$(git rev-parse HEAD)" = 76b440cafc66621e3cb29072a1f4a3ba57f3e0d1
          test "$(git rev-parse HEAD^{tree})" = 06f4bac138b7bcdb2a313a39b8d2cdf5ddbe0f96
          echo "a5dfb8b8e0ae8e8aa6e79cc5654903f578020197b245059f15cf094e087531f5  ui/package-lock.json" | sha256sum --check

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"

      - name: Record tool versions
        run: |
          go version
          node --version
          npm --version

      - name: Fresh locked dependency installation
        working-directory: ui
        env:
          npm_config_allow_git: all
        run: npm ci

      - name: Production dependency audit
        working-directory: ui
        run: npm audit --omit=dev

      - name: Full dependency audit
        working-directory: ui
        run: npm audit

      - name: Go tests and race checks
        working-directory: wasm
        run: |
          go test ./...
          go test -race ./...

      - name: Native and WASM vet
        working-directory: wasm
        run: |
          go vet ./...
          GOOS=js GOARCH=wasm go vet ./...

      - name: Typecheck and lint
        working-directory: ui
        run: |
          npm run typecheck
          npm run lint

      - name: Wallet, command, date and relay fixtures
        working-directory: ui
        run: |
          npm run wallet:provider
          npm run commands
          npm run dates
          npm run relay:delivery

      - name: Build and smoke the development instance
        working-directory: ui
        run: |
          npm run build:dev
          npm run smoke:dev -- ../dist-dev/ferry.wasm

      - name: Build and smoke the production instance
        working-directory: ui
        run: |
          npm run build
          npm run smoke -- ../dist/ferry.wasm
