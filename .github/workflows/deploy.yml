name: Validate PR 15 pinned source
run-name: PR 15 source febb350 validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr15-febb350-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the reviewed PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sol-znn/ferry-web
          ref: febb350cb3495d8a02f35fdb2d56e63c5199beeb
          persist-credentials: false

      - name: Verify source and lockfile pins
        run: |
          test "$(git rev-parse HEAD)" = febb350cb3495d8a02f35fdb2d56e63c5199beeb
          test "$(git rev-parse HEAD^{tree})" = ba5b9a819a0c8ab901b2aabf6795db0acda20699
          echo "184ea97cf41d7590b005d1af3cf18f76d338a5fb4c9f5b93ef2411982d2b9b2c  ui/package-lock.json" | sha256sum --check

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"

      - name: Record tool versions
        run: |
          go version
          node --version
          npm --version

      - name: Fresh locked dependency installation
        working-directory: ui
        env:
          npm_config_allow_git: all
        run: npm ci

      # Audits expose pre-existing master dependency findings separately from
      # the compatibility checks. Their actual failures remain visible.
      - name: Production dependency audit (diagnostic)
        continue-on-error: true
        working-directory: ui
        run: npm audit --omit=dev

      - name: Full dependency audit (diagnostic)
        continue-on-error: true
        working-directory: ui
        run: npm audit

      - name: Go tests and race checks
        working-directory: wasm
        run: |
          go test ./...
          go test -race ./...

      - name: Native and WASM vet
        working-directory: wasm
        run: |
          go vet ./...
          GOOS=js GOARCH=wasm go vet ./...

      - name: Typecheck and lint
        working-directory: ui
        run: |
          npm run typecheck
          npm run lint

      - name: Wallet, command, date and relay fixtures
        working-directory: ui
        run: |
          npm run wallet:provider
          npm run commands
          npm run dates
          npm run relay:delivery

      - name: Build and smoke the development instance
        working-directory: ui
        run: |
          npm run build:dev
          npm run smoke:dev -- ../dist-dev/ferry.wasm

      - name: Build and smoke the production instance
        working-directory: ui
        run: |
          npm run build
          npm run smoke -- ../dist/ferry.wasm
